name: Check launcher
on: [push, pull_request]
jobs:
  qt-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: pip install 'PySide6>=6.8,<7'
      - run: python -m unittest discover -s tests -v
      - run: bash -n system/bootstrap.sh system/install.sh system/first-login.sh system/saar-update
